<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Imon</title>
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="session" id="session" aria-live="polite">
    <h1>Imon</h1>
    <p id="session-status">正在打开本地面板...</p>
    <button type="button" class="action secondary" id="session-retry" hidden>重新连接</button>
    <noscript><p>本地面板需要 JavaScript。</p></noscript>
  </main>

  <div class="workspace" id="workspace" hidden>
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h4l3-7 4 12 3-5h4"/></svg>
        </span>
        <span>Imon</span>
      </div>
      <nav aria-label="主导航">
        <a href="/?view=targets" data-nav="targets">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="8" rx="2"/><rect x="3" y="13" width="18" height="8" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg>
          主机管理
        </a>
        <a href="/?view=services" data-nav="services">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m12 2 9 5-9 5-9-5 9-5Zm-9 10 9 5 9-5M3 17l9 5 9-5"/></svg>
          服务
        </a>
        <a href="/?view=network" data-nav="network">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="16" y="16" width="6" height="6" rx="1"/><path d="M12 8v4m-7 4v-4h14v4"/></svg>
          网络
        </a>
        <a href="/?view=alerts" data-nav="alerts">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 21h4M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/></svg>
          告警 <span class="nav-count" id="unread-count" hidden></span>
        </a>
        <a href="/?view=settings" data-nav="settings">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h7m4 0h5M4 12h3m4 0h9M4 18h12m4 0h0M11 3v6M7 9v6m9 0v6"/></svg>
          采集设置
        </a>
      </nav>
      <footer class="sidebar-footer">
        <button id="version-trigger" type="button" class="version-trigger" aria-expanded="false" aria-controls="version-popover" hidden>
          <span id="version-number"></span><span id="update-dot" class="update-dot" hidden></span>
        </button>
        <section id="version-popover" class="version-popover stack" aria-label="客户端更新" hidden></section>
      </footer>
    </aside>

    <main class="content" id="content" aria-busy="false"></main>
    <p class="route-progress" id="route-progress" role="status" hidden>正在加载…</p>
    <div class="toast" id="toast" role="status" hidden></div>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div id="dialog-body"></div>
    </dialog>
  </div>
</body>
</html>
